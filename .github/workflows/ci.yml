name: CI

# Every branch except main, and every pull request. Pushes to main are
# covered by deploy.yml, which runs the same checks and then ships, so
# running both there would just do the work twice.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sysora-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sysora-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # The build prerenders every static page, so a page that throws at
      # render time fails here rather than in production, and it proves
      # the route tree still compiles.
      #
      # The Supabase and Stripe keys are deliberately absent. Nothing
      # that runs at build time may require them, and if something
      # starts to, this step is where we find out.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.sysorastack.com
