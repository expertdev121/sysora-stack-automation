# Slack app manifest for the Sysora Credential Desk bot.
# api.slack.com/apps -> Create New App -> From a manifest -> pick workspace -> paste.
#
# Deliberately omits event_subscriptions: Slack verifies the Request URL the
# moment you save, and the n8n workflow has to be ACTIVE to answer that
# challenge. Add the URL + bot events in the UI afterwards (see README).

display_information:
  name: Sysora Credential Desk
  description: Internal credential lookup. DM me for a shared login.
  background_color: "#1f2933"

features:
  bot_user:
    display_name: Credential Desk
    always_online: true
  app_home:
    home_tab_enabled: false
    # messages_tab + read_only false == "Allow users to send Slash commands and
    # messages from the messages tab". Without this nobody can DM the bot.
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false

oauth_config:
  scopes:
    bot:
      - chat:write        # send the reply
      - app_mentions:read # receive @mentions
      - im:history        # read DMs sent to the bot
      - im:read           # resolve DM channels
      - im:write          # open a DM
      - users:read        # optional: resolve member IDs to names

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
