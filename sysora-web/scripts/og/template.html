<!doctype html>
<!--
  The share images in public/og. Regenerate with scripts/og/generate.sh.
  The headline and subline come from the query string, so there is one
  layout and six images rather than six layouts.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Share image</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    box-sizing: border-box;
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background:
      radial-gradient(900px 480px at 92% -10%, rgba(0, 200, 150, 0.32), rgba(0, 200, 150, 0) 62%),
      linear-gradient(135deg, #0a1f14, #14503c);
    font-family: "Space Grotesk", system-ui, sans-serif;
    color: #fff;
  }
  img { height: 52px; width: auto; display: block; filter: brightness(0) invert(1); }
  h1 { margin: 0; font-size: 68px; line-height: 1.08; letter-spacing: -1.6px; font-weight: 700; max-width: 1000px; }
  p { margin: 22px 0 0; font-size: 28px; font-weight: 500; color: #a7f3d0; }
  footer { font-size: 24px; font-weight: 500; color: rgba(255, 255, 255, 0.72); }
</style>
</head>
<body>
  <img src="../../public/sysora-logo.svg" alt="" />
  <div>
    <h1 id="t"></h1>
    <p id="s"></p>
  </div>
  <footer>sysorastack.com</footer>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById("t").textContent = q.get("t");
    document.getElementById("s").textContent = q.get("s");
  </script>
</body>
</html>
